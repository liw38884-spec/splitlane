[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-dev-splitlane"
version = "0.1.0"
description = "Validate SplitLane USDC settlement drafts for the Anna App"
requires-python = ">=3.10"

[project.scripts]
"tool-dev-splitlane" = "splitlane_plugin:main"

[tool.setuptools]
py-modules = ["splitlane_plugin"]
